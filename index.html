<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>잠시 살아도 잘 살도록 · 둥지와 철새</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF6EC;
      --card: #FFFFFF;
      --green: #245943;
      --green-light: #E8F2EA;
      --brown: #4A3520;
      --muted: #7C6A56;
      --border: #E2D9C5;
      --accent: #D07D3E;
      --danger: #C94A38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--brown);
      line-height: 1.55;
      padding-bottom: 60px;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 18px 14px; }
    .hero {
      background: linear-gradient(135deg, #FFFDF7 0%, #F5ECDA 100%);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(74, 53, 32, 0.05);
    }
    .badge {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 13px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .hero h1 {
      font-family: 'Gowun Batang', serif;
      font-size: 27px;
      color: var(--brown);
      margin-bottom: 6px;
    }
    .hero p { font-size: 14px; color: var(--muted); }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: #FFFDF8;
      border: 1.5px solid var(--border);
      color: var(--brown);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .tab-btn.admin-tab { padding: 12px 14px; font-size: 13px; color: var(--muted); }
    .tab-btn.admin-tab.active { color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(74, 53, 32, 0.04);
    }
    .sec-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14.5px;
      font-family: inherit;
      background: #FFFDF9;
      color: var(--brown);
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); background: #fff; }
    .btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn:active { opacity: 0.85; }
    .btn-sub { background: var(--accent); width: 100%; padding: 14px; font-size: 16px; margin-top: 8px; }
    .btn-danger { background: var(--danger); padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
    .btn-outline { background: #fff; color: var(--green); border: 1.5px solid var(--green); padding: 8px 12px; font-size: 13px; }

    #searchResults {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .sr-item { padding: 10px 12px; border-bottom: 1px solid #F2ECE0; cursor: pointer; font-size: 13.5px; }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:hover { background: var(--green-light); }
    .sr-sub { font-size: 12px; color: var(--muted); }

    #map, #viewMap {
      width: 100%;
      height: 310px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      margin-bottom: 12px;
      z-index: 1;
    }
    #viewMap { height: 390px; }
    .picked-info {
      background: var(--green-light);
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 13px;
      color: var(--green);
      margin-bottom: 14px;
      display: none;
    }
    .field { margin-bottom: 13px; }
    label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
    .req { color: var(--danger); }

    /* Nest Post-it Live Preview */
    .preview-wrap { display: flex; flex-direction: column; align-items: center; margin: 8px 0 6px; }
    .nest-circle {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFFBF0 63%, #B88B56 66%, #8C6234 86%, #6B4722 100%);
      border: 3px solid #6B4722;
      box-shadow: 0 8px 20px rgba(74, 53, 32, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 38px 32px;
      text-align: center;
    }
    .nest-place {
      font-weight: 700;
      font-size: 14px;
      color: var(--brown);
      border-bottom: 1.5px dashed #B8A890;
      padding-bottom: 4px;
      margin-bottom: 6px;
      width: 100%;
      word-break: keep-all;
    }
    .nest-reason {
      font-size: 12.5px;
      color: #5C4A34;
      line-height: 1.45;
      word-break: keep-all;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .nest-nick { font-size: 11px; color: var(--muted); margin-top: 7px; }
    .toast {
      display: none;
      background: #245943;
      color: #fff;
      padding: 13px 16px;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }

    /* Region Filter Chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      border: 1.5px solid var(--border);
      background: #FFFDF9;
      color: var(--brown);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .chip.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* Nest List Cards */
    .nest-list { display: grid; gap: 10px; }
    .nest-item {
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      background: #FFFDF9;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .nest-item-tag {
      display: inline-block;
      background: var(--green-light);
      color: var(--green);
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .nest-item h4 { font-size: 15px; margin-bottom: 3px; }
    .nest-item p { font-size: 13.5px; color: #5C4A34; margin-bottom: 4px; }
    .nest-item small { font-size: 12px; color: var(--muted); }
    .empty-box { text-align: center; padding: 28px 12px; color: var(--muted); font-size: 14px; }
    .notice-bar {
      background: #FFF6E5;
      border: 1px solid #EBD4AA;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 12.5px;
      color: #7A5420;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="badge">1일 오프라인 팝업 · 둥지와 철새</span>
    <h1>잠시 살아도 잘 살도록</h1>
    <p>내가 잘 아는 동네의 최애 장소를 지도 위 작은 ‘둥지’로 남겨주세요</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('write', this)">🪺 둥지 남기기</button>
    <button class="tab-btn" onclick="switchTab('map', this)">🗺️ 전국 둥지 지도</button>
    <button class="tab-btn admin-tab" onclick="switchTab('admin', this)">⚙️ 관리</button>
  </div>

  <!-- TAB 1: WRITE -->
  <div id="panel-write" class="panel active">
    <div class="card">
      <div class="sec-title">1. 지도에서 장소 찾기</div>
      <div class="search-row">
        <input type="text" id="q" placeholder="식당, 도서관, 카페, 동네 검색 (예: 이천시립도서관)" />
        <button class="btn" type="button" onclick="searchPlace()">검색</button>
      </div>
      <div id="searchResults"></div>
      <div id="map"></div>
      <div class="picked-info" id="pickedInfo"></div>

      <div class="field">
        <label>권역 선택 <span class="req">*</span></label>
        <select id="region">
          <option value="이천시">이천시</option>
          <option value="서울">서울</option>
          <option value="인천">인천</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="충청">충청</option>
          <option value="전라">전라</option>
          <option value="경상">경상</option>
          <option value="제주">제주</option>
        </select>
      </div>

      <div class="field">
        <label>동네 / 상세 위치 <span class="req">*</span></label>
        <input type="text" id="area" placeholder="지도에서 찍거나 직접 입력 (예: 이천시 창전동)" oninput="updatePreview()" />
      </div>

      <div class="field">
        <label>최애 장소 이름 <span class="req">*</span></label>
        <input type="text" id="placeName" placeholder="예: 설봉공원 산책길" oninput="updatePreview()" />
      </div>

      <div class="field">
        <label>추천 이유 <span class="req">*</span></label>
        <textarea id="reason" rows="3" placeholder="이곳을 추천하는 이유를 한두 줄로 적어주세요!" oninput="updatePreview()"></textarea>
      </div>

      <div class="field">
        <label>닉네임 (선택)</label>
        <input type="text" id="nick" placeholder="예: 익명의 둥지지기" oninput="updatePreview()" />
      </div>
    </div>

    <div class="card">
      <div class="sec-title">2. 내 둥지 포스트잇 미리보기</div>
      <div class="preview-wrap">
        <div class="nest-circle">
          <div class="nest-place" id="pvPlace">장소를 입력해 주세요</div>
          <div class="nest-reason" id="pvReason">추천 이유가 여기에 표시됩니다</div>
          <div class="nest-nick" id="pvNick"></div>
        </div>
      </div>
      <button class="btn btn-sub" type="button" onclick="submitForm()">🪺 내 둥지 남기기</button>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <!-- TAB 2: PUBLIC MAP -->
  <div id="panel-map" class="panel">
    <div class="card">
      <div class="sec-title">
        <span>🗺️ 전국 둥지 지도 (<span id="publicCount">0</span>)</span>
        <button class="btn btn-outline" onclick="loadNests()">새로고침</button>
      </div>
      <div class="chips" id="publicChips"></div>
      <div id="viewMap"></div>
      <div class="nest-list" id="publicList"></div>
    </div>
  </div>

  <!-- TAB 3: ADMIN -->
  <div id="panel-admin" class="panel">
    <div class="card" id="adminLoginBox">
      <div class="sec-title">⚙️ 관리자 로그인</div>
      <p style="font-size:13.5px; color:var(--muted); margin-bottom:10px;">등록된 둥지를 권역별로 검토하고 삭제할 수 있어요.</p>
      <div class="search-row">
        <input type="password" id="adminPw" placeholder="비밀번호 입력" />
        <button class="btn" onclick="loginAdmin()">확인</button>
      </div>
    </div>

    <div class="card" id="adminBody" style="display:none;">
      <div class="sec-title">
        <span>📋 둥지 검토 및 관리 (<span id="adminCount">0</span>)</span>
        <button class="btn btn-outline" onclick="exportCSV()">엑셀(CSV) 저장</button>
      </div>
      <div id="dbNotice" class="notice-bar" style="display:none;"></div>
      <div class="chips" id="adminChips"></div>
      <div class="nest-list" id="adminList"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b0277ab1320164fe512b7833d698cf74&libraries=services&autoload=false"></script>
<script>
  // ▼ 여기에 Google Apps Script 웹앱 URL을 넣으면 모든 방문자가 실시간 공유합니다!
  const API_URL = "https://script.google.com/macros/s/AKfycbyYaYmN207HFwAcWVKg7FgHzHWuc29See-DiVoXdm0j5gRxaAAscU13YWhtdYoS5s08/exec";
  const ADMIN_PASS = "1127"; // 필요 시 변경
  const REGIONS = ["전체", "이천시", "서울", "인천", "경기", "강원", "충청", "전라", "경상", "제주"];
  const REGION_CENTERS = {
    "전체": [36.35, 127.85, 7],
    "이천시": [37.272, 127.435, 11],
    "서울": [37.5665, 126.978, 11],
    "인천": [37.456, 126.705, 11],
    "경기": [37.413, 127.518, 9],
    "강원": [37.822, 128.155, 9],
    "충청": [36.635, 127.491, 9],
    "전라": [35.35, 127.0, 9],
    "경상": [35.85, 128.75, 8],
    "제주": [33.38, 126.55, 10]
  };

  let allNests = [];
  let publicFilter = "전체";
  let adminFilter = "전체";
  let isAdmin = false;

  // --- Maps ---
  const map = L.map('map').setView([37.272, 127.435], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
  let marker = null;

  const viewMap = L.map('viewMap').setView([36.35, 127.85], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(viewMap);
  let viewLayer = L.layerGroup().addTo(viewMap);

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
    if (name === 'write') setTimeout(() => map.invalidateSize(), 100);
    if (name === 'map') {
      setTimeout(() => { viewMap.invalidateSize(); renderPublic(); }, 100);
    }
    if (name === 'admin' && isAdmin) renderAdmin();
  }

  // --- Local fallback storage ---
  function getLocalNests() {
    try {
      const raw = localStorage.getItem('staywell_nests_v1');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    const seed = [
      { id: "seed1", region: "이천시", area: "이천시 관고동", placeName: "설봉공원 산책길", reason: "밤에 호수 따라 걷기 좋고 조용해서 머리 식히기 최고예요.", nick: "이천둥지", lat: 37.2775, lng: 127.4285, createdAt: "2026-11-23" },
      { id: "seed2", region: "서울", area: "서울 마포구 연남동", placeName: "경의선 숲길", reason: "퇴근 후 산책하기 딱 좋고 주변에 혼자 가기 편한 카페가 많아요.", nick: "연남철새", lat: 37.5612, lng: 126.9248, createdAt: "2026-11-23" }
    ];
    localStorage.setItem('staywell_nests_v1', JSON.stringify(seed));
    return seed;
  }
  function saveLocalNests(arr) {
    localStorage.setItem('staywell_nests_v1', JSON.stringify(arr));
  }

  async function loadNests() {
    if (API_URL) {
      try {
        const res = await fetch(API_URL + "?action=list");
        const data = await res.json();
        allNests = Array.isArray(data.items) ? data.items : [];
      } catch (e) {
        allNests = getLocalNests();
      }
    } else {
      allNests = getLocalNests();
      const n = document.getElementById('dbNotice');
      n.style.display = 'block';
      n.innerHTML = '💡 현재는 <strong>체험 모드(내 브라우저 임시 저장)</strong>예요. 구글 시트 웹앱 URL을 연결하면 모든 방문자의 글이 실시간으로 모입니다.';
    }
    renderPublic();
    if (isAdmin) renderAdmin();
  }

  function renderChips(containerId, current, onPick) {
    const el = document.getElementById(containerId);
    el.innerHTML = REGIONS.map(r => {
      const cnt = r === "전체" ? allNests.length : allNests.filter(x => x.region === r).length;
      return `<button class="chip ${current === r ? 'active' : ''}" onclick="${onPick}('${r}')">${r} (${cnt})</button>`;
    }).join('');
  }

  function setPublicFilter(r) {
    publicFilter = r;
    const c = REGION_CENTERS[r];
    if (c) viewMap.setView([c[0], c[1]], c[2]);
    renderPublic();
  }
  function setAdminFilter(r) {
    adminFilter = r;
    renderAdmin();
  }

  function renderPublic() {
    renderChips('publicChips', publicFilter, 'setPublicFilter');
    const filtered = publicFilter === "전체" ? allNests : allNests.filter(x => x.region === publicFilter);
    document.getElementById('publicCount').textContent = filtered.length;

    viewLayer.clearLayers();
    const nestIcon = L.divIcon({
      className: 'custom-nest-pin',
      html: '<div style="font-size:24px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));">🪺</div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    filtered.forEach(it => {
      if (it.lat && it.lng) {
        const m = L.marker([parseFloat(it.lat), parseFloat(it.lng)], { icon: nestIcon }).addTo(viewLayer);
        m.bindPopup(`
          <div style="min-width:170px; font-family:'Noto Sans KR',sans-serif;">
            <div style="font-size:11px; color:#245943; font-weight:700;">${it.region} · ${it.area}</div>
            <div style="font-size:14px; font-weight:700; margin:3px 0;">${it.placeName}</div>
            <div style="font-size:12.5px; color:#4A3520;">${it.reason}</div>
            <div style="font-size:11px; color:#7C6A56; margin-top:4px;">by. ${it.nick || '익명'}</div>
          </div>
        `);
      }
    });

    const listEl = document.getElementById('publicList');
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-box">아직 이 권역에 등록된 둥지가 없어요. 첫 번째 둥지지기가 되어보세요!</div>';
      return;
    }
    listEl.innerHTML = filtered.slice().reverse().map(it => `
      <div class="nest-item" onclick="focusPin(${it.lat || 'null'}, ${it.lng || 'null'})" style="cursor:pointer;">
        <div>
          <span class="nest-item-tag">${it.region} · ${it.area}</span>
          <h4>🪺 ${escapeHtml(it.placeName)}</h4>
          <p>${escapeHtml(it.reason)}</p>
          <small>by. ${escapeHtml(it.nick || '익명의 둥지지기')}</small>
        </div>
      </div>
    `).join('');
  }

  function focusPin(lat, lng) {
    if (lat && lng) {
      viewMap.setView([parseFloat(lat), parseFloat(lng)], 15);
      window.scrollTo({ top: 180, behavior: 'smooth' });
    }
  }

  // --- Admin ---
  function loginAdmin() {
    const pw = document.getElementById('adminPw').value;
    if (pw === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('adminLoginBox').style.display = 'none';
      document.getElementById('adminBody').style.display = 'block';
      renderAdmin();
    } else {
      alert('비밀번호가 맞지 않아요.');
    }
  }

  function renderAdmin() {
    renderChips('adminChips', adminFilter, 'setAdminFilter');
    const filtered = adminFilter === "전체" ? allNests : allNests.filter(x => x.region === adminFilter);
    document.getElementById('adminCount').textContent = filtered.length;
    const listEl = document.getElementById('adminList');
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-box">등록된 둥지가 없어요.</div>';
      return;
    }
    listEl.innerHTML = filtered.slice().reverse().map(it => `
      <div class="nest-item">
        <div>
          <span class="nest-item-tag">${it.region} · ${it.area}</span>
          <h4>${escapeHtml(it.placeName)}</h4>
          <p>${escapeHtml(it.reason)}</p>
          <small>by. ${escapeHtml(it.nick || '익명')} · ${(it.createdAt || '').slice(0, 10)}</small>
        </div>
        <button class="btn btn-danger" onclick="deleteNest('${it.id}')">삭제</button>
      </div>
    `).join('');
  }

  async function deleteNest(id) {
    if (!confirm('이 둥지를 삭제할까요?')) return;
    if (API_URL) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', id })
        });
      } catch (_) {}
    } else {
      const next = getLocalNests().filter(x => String(x.id) !== String(id));
      saveLocalNests(next);
    }
    await loadNests();
  }

  function exportCSV() {
    const filtered = adminFilter === "전체" ? allNests : allNests.filter(x => x.region === adminFilter);
    const header = ["권역", "동네", "장소명", "추천이유", "닉네임", "위도", "경도", "등록일"];
    const rows = filtered.map(x => [x.region, x.area, x.placeName, x.reason, x.nick, x.lat, x.lng, x.createdAt].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(","));
    const csv = "\uFEFF" + header.join(",") + "\n" + rows.join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `둥지목록_${adminFilter}.csv`;
    a.click();
  }

  // --- Write / Search ---
  function setPin(lat, lng, labelText) {
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    map.setView([lat, lng], 15);
    const info = document.getElementById('pickedInfo');
    info.style.display = 'block';
    info.textContent = `📍 선택된 위치: ${labelText || `${lat.toFixed(5)}, ${lng.toFixed(5)}`}`;
  }

  let kakaoReady = false;
  let kakaoPlaces = null;
  let kakaoGeocoder = null;
  if (window.kakao && kakao.maps) {
    kakao.maps.load(() => {
      kakaoReady = true;
      kakaoPlaces = new kakao.maps.services.Places();
      kakaoGeocoder = new kakao.maps.services.Geocoder();
    });
  }

  function guessRegion(addr) {
    if (!addr) return null;
    if (addr.includes('이천')) return '이천시';
    if (addr.includes('서울')) return '서울';
    if (addr.includes('인천')) return '인천';
    if (addr.includes('경기')) return '경기';
    if (addr.includes('강원')) return '강원';
    if (addr.includes('충청') || addr.includes('충북') || addr.includes('충남') || addr.includes('대전') || addr.includes('세종')) return '충청';
    if (addr.includes('전라') || addr.includes('전북') || addr.includes('전남') || addr.includes('광주')) return '전라';
    if (addr.includes('경상') || addr.includes('경북') || addr.includes('경남') || addr.includes('부산') || addr.includes('대구') || addr.includes('울산')) return '경상';
    if (addr.includes('제주')) return '제주';
    return null;
  }

  function shortAreaFromAddr(addr) {
    if (!addr) return '';
    const parts = addr.trim().split(/\s+/);
    return parts.slice(0, 3).join(' ');
  }

  map.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    setPin(lat, lng);
    if (kakaoReady && kakaoGeocoder) {
      kakaoGeocoder.coord2Address(lng, lat, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result[0]) {
          const addr = (result[0].road_address && result[0].road_address.address_name) ||
                       (result[0].address && result[0].address.address_name) || '';
          const r = guessRegion(addr);
          if (r) document.getElementById('region').value = r;
          const shortArea = shortAreaFromAddr(addr);
          if (shortArea) document.getElementById('area').value = shortArea;
          setPin(lat, lng, addr || shortArea);
          updatePreview();
          return;
        }
        fallbackReverseGeocode(lat, lng);
      });
    } else {
      fallbackReverseGeocode(lat, lng);
    }
  });

  async function fallbackReverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko`);
      const data = await res.json();
      const disp = data.display_name || '';
      const r = guessRegion(disp);
      if (r) document.getElementById('region').value = r;
      const addrObj = data.address || {};
      const shortArea = [addrObj.city || addrObj.county || addrObj.province, addrObj.borough || addrObj.suburb || addrObj.town || addrObj.village].filter(Boolean).join(' ');
      if (shortArea) document.getElementById('area').value = shortArea;
      setPin(lat, lng, shortArea || disp);
      updatePreview();
    } catch (_) {}
  }

  async function searchPlace() {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    const box = document.getElementById('searchResults');
    box.style.display = 'block';
    box.innerHTML = '<div class="sr-item">검색 중...</div>';

    if (kakaoReady && kakaoPlaces) {
      kakaoPlaces.keywordSearch(q, (data, status) => {
        if (status === kakao.maps.services.Status.OK && data.length) {
          box.innerHTML = data.slice(0, 10).map(it => {
            const addr = it.road_address_name || it.address_name || '';
            const cat = it.category_group_name ? ` · ${it.category_group_name}` : '';
            return `
              <div class="sr-item" onclick='pickResult(${it.y}, ${it.x}, ${JSON.stringify(it.place_name)}, ${JSON.stringify(addr)})'>
                <strong>${escapeHtml(it.place_name)}</strong><span class="sr-sub">${escapeHtml(cat)}</span>
                <div class="sr-sub">${escapeHtml(addr)}</div>
              </div>
            `;
          }).join('');
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
          box.innerHTML = '<div class="sr-item">검색 결과가 없어요. 지도를 직접 눌러 찍어주세요!</div>';
        } else {
          fallbackNominatimSearch(q, box);
        }
      });
      return;
    }
    fallbackNominatimSearch(q, box);
  }

  async function fallbackNominatimSearch(q, box) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&countrycodes=kr&limit=5&accept-language=ko`);
      const list = await res.json();
      if (!list.length) {
        box.innerHTML = '<div class="sr-item">검색 결과가 없어요. 지도를 직접 눌러 찍어주세요!</div>';
        return;
      }
      box.innerHTML = list.map(it => `
        <div class="sr-item" onclick='pickResult(${it.lat}, ${it.lon}, ${JSON.stringify(it.name || q)}, ${JSON.stringify(it.display_name)})'>
          <strong>${escapeHtml(it.name || q)}</strong>
          <div class="sr-sub">${escapeHtml(it.display_name)}</div>
        </div>
      `).join('');
    } catch (e) {
      box.innerHTML = '<div class="sr-item">검색 연결에 실패했어요. 지도를 직접 탭해 주세요.</div>';
    }
  }

  function pickResult(lat, lon, name, fullAddr) {
    document.getElementById('searchResults').style.display = 'none';
    setPin(parseFloat(lat), parseFloat(lon), `${name} (${fullAddr})`);
    const r = guessRegion(fullAddr);
    if (r) document.getElementById('region').value = r;
    document.getElementById('placeName').value = name;
    document.getElementById('area').value = shortAreaFromAddr(fullAddr) || fullAddr.split(',').slice(0, 3).join(' ').trim();
    updatePreview();
  }

  document.getElementById('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchPlace();
  });

  function updatePreview() {
    const p = document.getElementById('placeName').value.trim();
    const r = document.getElementById('reason').value.trim();
    const n = document.getElementById('nick').value.trim();
    document.getElementById('pvPlace').textContent = p || '장소를 입력해 주세요';
    document.getElementById('pvReason').textContent = r || '추천 이유가 여기에 표시됩니다';
    document.getElementById('pvNick').textContent = n ? `by. ${n}` : '';
  }

  async function submitForm() {
    const region = document.getElementById('region').value;
    const area = document.getElementById('area').value.trim();
    const placeName = document.getElementById('placeName').value.trim();
    const reason = document.getElementById('reason').value.trim();
    const nick = document.getElementById('nick').value.trim() || '익명의 둥지지기';

    if (!area || !placeName || !reason) {
      alert('동네, 장소 이름, 추천 이유를 모두 입력해 주세요!');
      return;
    }

    const center = REGION_CENTERS[region] || [37.5665, 126.978];
    const item = {
      id: "n_" + Date.now(),
      action: "add",
      region, area, placeName, reason, nick,
      lat: marker ? marker.getLatLng().lat : center[0],
      lng: marker ? marker.getLatLng().lng : center[1],
      createdAt: new Date().toISOString()
    };

    if (API_URL) {
      try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify(item) });
      } catch (_) {}
    } else {
      const arr = getLocalNests();
      arr.push(item);
      saveLocalNests(arr);
    }

    await loadNests();
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    toast.innerHTML = `✅ <strong>${escapeHtml(placeName)}</strong> 둥지가 전국 둥지 지도에 등록되었어요!<br/>상단 <b>[🗺️ 전국 둥지 지도]</b> 탭에서 바로 보실 수 있어요.`;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  loadNests();
</script>
</body>
</html>
